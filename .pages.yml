# Pages CMS (app.pagescms.org): rich-text editor for the blog.
# Saving a post commits to main, which redeploys the site.
media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: Short description
        description: One sentence, shown on the blog list and in link previews.
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  - name: projects
    label: Case studies
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, kind, featured, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: kind, label: Category line, type: string, description: "e.g. SIEM · Threat detection playbook" }
      - { name: summary, label: Summary, type: text, description: "One or two sentences for cards and search results." }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: featured, label: Featured on home page, type: boolean, default: false }
      - name: icon
        label: Icon
        type: select
        options: { values: [siem, network, forensics, phishing, code, web] }
      - { name: context, label: Context label, type: string, description: "e.g. Lab methodology, built from BTL1 labs" }
      - { name: tools, label: Tools, type: string, list: true }
      - name: mitre
        label: MITRE ATT&CK techniques
        type: object
        list: true
        fields:
          - { name: id, label: Technique ID, type: string }
          - { name: name, label: Name, type: string }
          - { name: tactic, label: Tactic, type: string }
      - { name: repo, label: GitHub repo URL, type: string }
      - { name: live, label: Live URL, type: string }
      - { name: draft, label: Draft, type: boolean, default: false }
      - name: body
        label: Write-up
        type: rich-text
        options:
          format: markdown
