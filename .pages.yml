# Pages CMS (app.pagescms.org): rich-text editor for the blog.
# Saving a post commits to main, which redeploys the site.
media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: Short description
        description: One sentence, shown on the blog list and in link previews.
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
